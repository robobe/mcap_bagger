[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcap-bagger"
version = "0.1.0"
description = "Record raw ZeroMQ images and JSON telemetry into MCAP"
requires-python = ">=3.12"
dependencies = [
    "bullet-msgs",
  "pyzmq>=27,<28",
  "foxglove-schemas-protobuf>=0.3,<0.4",
  "jsonschema>=4,<5",
  "mcap>=1.3,<2",
  "protobuf>=5,<8",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
demo = ["pillow>=11,<13"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
mcap-bagger = "mcap_bagger.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
bullet-msgs = { workspace = true }
