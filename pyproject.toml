[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcap-bagger"
version = "0.1.0"
description = "Record raw ZeroMQ images and JSON telemetry into MCAP"
requires-python = ">=3.12"
dependencies = [
  "click>=8.5,<9",
  "loguru>=0.7,<1",
  "pillow>=11,<13",
  "pyzmq>=27,<28",
  "mcap>=1.6,<2",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
mcap-bagger = "mcap_bagger.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
